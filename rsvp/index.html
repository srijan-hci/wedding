<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Let Akriti and Srijan know whether you can be there on 20 and 21 February 2027."
    />
    <title>RSVP &middot; Akriti &amp; Srijan</title>
    <link rel="icon" href="../favicon-32.png?v=2" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../favicon-180.png" />
    <link rel="stylesheet" href="../styles.css" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>

  <body>
    <!-- ===== THE WALL =====
         Same wall, same shadow, on every page. -->
    <picture class="background-layer" aria-hidden="true">
      <source
        media="(max-width: 600px)"
        type="image/avif"
        srcset="../Assets/background-1200.avif"
      />
      <source
        media="(max-width: 600px)"
        type="image/jpeg"
        srcset="../Assets/background-1200.jpg"
      />
      <source
        type="image/avif"
        srcset="
          ../Assets/background-1200.avif 1200w,
          ../Assets/background-1600.avif 1600w,
          ../Assets/background-3200.avif 3200w
        "
        sizes="100vw"
      />
      <img
        src="../Assets/background-1600.jpg"
        srcset="
          ../Assets/background-1200.jpg 1200w,
          ../Assets/background-1600.jpg 1600w,
          ../Assets/background-3200.jpg 3200w
        "
        sizes="100vw"
        alt=""
        width="3200"
        height="1684"
        decoding="async"
        fetchpriority="high"
      />
    </picture>

    <!-- A way out, not the thing to do. It keeps the same glass as the
         invitation's nav and shrinks to a single round button, sitting on
         the same left edge as every question below it.

         The arrow carries no text, so the anchor needs an aria-label:
         without one a screen reader announces it as just "link". -->
    <nav class="site-nav site-nav--back" aria-label="Main">
      <a class="glass" href="../" aria-label="Back to the invitation">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M15 5 8 12l7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </nav>

    <main class="content-layer rsvp-page">
      <h1 class="rsvp-title">RSVP</h1>
      <p class="rsvp-sub">
        20 &amp; 21 February 2027 &middot; Tharavadu Mane, Bangalore
      </p>

      <!-- One plain form. With scripting it becomes one question at a
           time; without it, every question is simply visible at once and
           the form still submits. Nothing here is hidden by the markup. -->
      <form id="rsvp-form" class="rsvp-flow" novalidate>
        <p class="rsvp-progress" data-progress aria-live="polite" hidden></p>

        <fieldset class="rsvp-step" data-step>
          <legend class="rsvp-q">What&rsquo;s your name?</legend>
          <label class="rsvp-label" for="rsvp-name">Full name</label>
          <input
            class="rsvp-input"
            id="rsvp-name"
            name="name"
            type="text"
            autocomplete="name"
            required
          />
          <label class="rsvp-label" for="rsvp-email">Email</label>
          <input
            class="rsvp-input"
            id="rsvp-email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </fieldset>

        <fieldset class="rsvp-step" data-step>
          <legend class="rsvp-q">Can you make it?</legend>
          <div class="rsvp-choices">
            <label class="rsvp-choice">
              <input type="radio" name="attending" value="Yes" required />
              <span>Yes, count me in</span>
            </label>
            <label class="rsvp-choice">
              <input type="radio" name="attending" value="No" />
              <span>Sadly not this time</span>
            </label>
          </div>
        </fieldset>

        <!-- rsvp.js hides and disables this whole block for a "no", and
             the stepper skips any step inside something hidden, so the
             two compose without either knowing about the other. -->
        <div id="rsvp-attending-details">
          <fieldset class="rsvp-step" data-step>
            <legend class="rsvp-q">How many of you are coming?</legend>
            <label class="rsvp-label" for="rsvp-guests">
              Including yourself
            </label>
            <input
              class="rsvp-input rsvp-input--short"
              id="rsvp-guests"
              name="guests"
              type="number"
              min="1"
              max="10"
              step="1"
              value="1"
              inputmode="numeric"
            />
          </fieldset>

          <fieldset class="rsvp-step" data-step>
            <legend class="rsvp-q">Do you need a room?</legend>
            <div class="rsvp-choices">
              <label class="rsvp-choice">
                <input type="radio" name="room" value="Yes" required />
                <span>Yes, please book one</span>
              </label>
              <label class="rsvp-choice">
                <input type="radio" name="room" value="No" />
                <span>No, I&rsquo;ve got it covered</span>
              </label>
            </div>
          </fieldset>
        </div>

        <fieldset class="rsvp-step" data-step data-review>
          <legend class="rsvp-q">Does this look right?</legend>
          <dl class="rsvp-review" data-review-list></dl>
        </fieldset>

        <!-- Bots fill in everything they can see. Nobody else will ever
             find this, and rsvp.js drops anything that has it filled. -->
        <p class="rsvp-honey" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </p>

        <p class="form-status" id="rsvp-status" role="status" aria-live="polite"></p>

        <div class="rsvp-actions">
          <button class="rsvp-back" type="button" data-back hidden>Back</button>
          <button class="rsvp-next glass" type="button" data-next hidden>
            Continue
          </button>
          <button class="rsvp-send glass" id="rsvp-submit" type="submit">
            Send it
          </button>
        </div>
      </form>
    </main>

    <div class="light-layer" aria-hidden="true">
      <canvas class="light-canvas"></canvas>
    </div>

    <script src="../main.js"></script>
    <script src="../light.js"></script>
    <script src="../rsvp.js"></script>
    <script src="steps.js"></script>
  </body>
</html>
